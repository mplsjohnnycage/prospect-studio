name: Prospect Studio CI
on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: prospect-studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    name: Build, contracts and anonymous access gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      NEXT_PUBLIC_CONVEX_SITE_URL: https://placeholder.convex.site
      CRON_SECRET: ""
      SANDBOX_PREVIEWS_ENABLED: "0"
      PROSPECT_EXPECT_READY: "0"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit contracts
        run: npm run test:unit
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit --incremental false
      - name: Production build
        run: npm run build
      - name: Start isolated application
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3111 > /tmp/prospect-ci-next.log 2>&1 &
          echo $! > /tmp/prospect-ci-next.pid
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3111/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/prospect-ci-next.log
          exit 1
      - name: HTTP authorization smoke checks
        run: node scripts/release-smoke.mjs
      - name: Capture boot log on failure
        if: failure()
        run: tail -90 /tmp/prospect-ci-next.log || true
